name: WareCommand CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux-quality:
    name: Linux quality and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.*', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore 'Warehouse Management System.sln' --nologo

      - name: Check NuGet vulnerabilities and deprecations
        shell: pwsh
        run: pwsh -NoProfile -File './scripts/verify-dependencies.ps1'

      - name: Build Linux-compatible production projects
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            'Wms.Domain/Wms.Domain.csproj' \
            'Wms.Application/Wms.Application.csproj' \
            'Wms.Infrastructure/Wms.Infrastructure.csproj' \
            'Wms.ASP/Wms.ASP.csproj' \
            'Wms.DataMigration/Wms.DataMigration.csproj'; do
            dotnet build "$project" -c Release --no-restore --nologo -v:minimal
          done

      - name: Run Linux-compatible tests with coverage
        id: tests
        shell: pwsh
        run: pwsh -NoProfile -File './scripts/run-test-suite.ps1' -Platform linux -RunId '${{ github.run_id }}-${{ github.run_attempt }}'

      - name: Verify Linux TRX and coverage evidence
        id: verify-test-artifacts
        if: always() && steps.tests.outcome != 'skipped'
        shell: pwsh
        run: pwsh -NoProfile -File './scripts/verify-test-artifacts.ps1' -Platform linux -ResultsRoot '${{ steps.tests.outputs.results_root }}'

      - name: Verify migration model and startup gate
        shell: pwsh
        run: pwsh -NoProfile -File './scripts/verify-migrations.ps1'

      - name: Repeat deterministic unit category
        shell: pwsh
        run: pwsh -NoProfile -File './scripts/verify-unit-tests.ps1' -Repetitions 2

      - name: Upload Linux test and coverage artifacts
        id: upload-test-artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/linux
          if-no-files-found: warn

      - name: Publish job summary
        if: always()
        shell: pwsh
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.verify-test-artifacts.outcome || 'skipped' }}
          UPLOAD_OUTCOME: ${{ steps.upload-test-artifacts.outcome || 'skipped' }}
          RESULTS_ROOT: ${{ steps.tests.outputs.results_root }}
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Linux quality and coverage'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Test step: $env:TEST_OUTCOME"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Evidence validation: $env:EVIDENCE_OUTCOME"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Artifact upload: $env:UPLOAD_OUTCOME"
          $summaryFile = if ([string]::IsNullOrWhiteSpace($env:RESULTS_ROOT)) { $null } else { Join-Path $env:RESULTS_ROOT 'test-summary.md' }
          if ($summaryFile -and (Test-Path -LiteralPath $summaryFile)) {
            Get-Content -LiteralPath $summaryFile | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
          else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- No test summary was produced because tests did not run or artifact validation stopped early.'
          }

  windows-quality:
    name: Windows solution quality and coverage
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.*', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore 'Warehouse Management System.sln' --nologo

      - name: Build complete solution including WinForms
        shell: pwsh
        run: dotnet build 'Warehouse Management System.sln' -c Release --no-restore --nologo -v:minimal

      - name: Run complete solution tests with coverage
        id: tests
        shell: pwsh
        run: pwsh -NoProfile -File './scripts/run-test-suite.ps1' -Platform windows -NoBuild -RunId '${{ github.run_id }}-${{ github.run_attempt }}'

      - name: Verify Windows TRX and coverage evidence
        id: verify-test-artifacts
        if: always() && steps.tests.outcome != 'skipped'
        shell: pwsh
        run: pwsh -NoProfile -File './scripts/verify-test-artifacts.ps1' -Platform windows -ResultsRoot '${{ steps.tests.outputs.results_root }}'

      - name: Verify formatting
        shell: pwsh
        run: dotnet format 'Warehouse Management System.sln' --verify-no-changes --no-restore --severity error

      - name: Verify migration model and startup gate
        shell: pwsh
        run: pwsh -NoProfile -File './scripts/verify-migrations.ps1'

      - name: Upload Windows test and coverage artifacts
        id: upload-test-artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/windows
          if-no-files-found: warn

      - name: Publish job summary
        if: always()
        shell: pwsh
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.verify-test-artifacts.outcome || 'skipped' }}
          UPLOAD_OUTCOME: ${{ steps.upload-test-artifacts.outcome || 'skipped' }}
          RESULTS_ROOT: ${{ steps.tests.outputs.results_root }}
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Windows solution quality and coverage'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Test step: $env:TEST_OUTCOME"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Evidence validation: $env:EVIDENCE_OUTCOME"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Artifact upload: $env:UPLOAD_OUTCOME"
          $summaryFile = if ([string]::IsNullOrWhiteSpace($env:RESULTS_ROOT)) { $null } else { Join-Path $env:RESULTS_ROOT 'test-summary.md' }
          if ($summaryFile -and (Test-Path -LiteralPath $summaryFile)) {
            Get-Content -LiteralPath $summaryFile | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
          else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- No test summary was produced because tests did not run or artifact validation stopped early.'
          }

  postgres-integration:
    name: Disposable PostgreSQL integration and migration
    runs-on: ubuntu-latest
    needs:
      - linux-quality
      - windows-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.*', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore 'Warehouse Management System.sln' --nologo

      - name: Verify PostgreSQL integration
        shell: pwsh
        run: pwsh -NoProfile -File './scripts/verify-postgresql.ps1' -Port 55432

      - name: Verify SQLite-to-PostgreSQL migration
        shell: pwsh
        run: pwsh -NoProfile -File './scripts/verify-data-migration.ps1' -Port 55433

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Disposable PostgreSQL integration and migration'
            echo '- PostgreSQL 17 containers are unique per verification and removed by the scripts.'
            echo '- Schema, startup refusal, seed/query behavior, import reconciliation, and rollback are exercised.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-failure-${{ github.run_id }}
          path: artifacts
          if-no-files-found: ignore

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          WARECOMMAND_POSTGRES_PASSWORD: ci-placeholder
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.postgres.yml config --quiet

      - name: Build production image
        run: >-
          docker build
          --build-arg WARECOMMAND_VERSION=0.0.0-ci.${{ github.run_number }}
          --build-arg WARECOMMAND_REVISION=${{ github.sha }}
          --build-arg WARECOMMAND_BUILD_DATE=${{ github.run_id }}
          --tag warecommand-wms-ci:${{ github.sha }}
          --file Wms.ASP/Dockerfile .

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Production Docker image'
            echo '- Compose configuration and the production Wms.ASP image build passed.'
            echo '- The image is tagged by commit SHA and carries OCI version/revision metadata.'
            echo '- No image is pushed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan the intended Git history
        id: secret-scan
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/verify-secret-scan.sh

      - name: Publish job summary
        if: always()
        shell: bash
        env:
          SCAN_STATUS: ${{ steps.secret-scan.outputs.status || 'not-run' }}
          SCAN_REASON: ${{ steps.secret-scan.outputs.reason || 'scan step did not produce a status' }}
          SCAN_RANGE: ${{ steps.secret-scan.outputs.scan_range || 'unresolved' }}
          SCAN_HEAD_SHA: ${{ steps.secret-scan.outputs.head_sha || github.sha }}
          SCAN_COMMIT_COUNT: ${{ steps.secret-scan.outputs.commit_count || '0' }}
          SCAN_REPORTED_COUNT: ${{ steps.secret-scan.outputs.scanner_commit_count || 'not-reported' }}
          SCAN_SCANNER_EXIT: ${{ steps.secret-scan.outputs.scanner_exit || 'not-run' }}
        run: |
          {
            echo '## Secret scan'
            echo "- Status: $SCAN_STATUS"
            echo "- Detail: $SCAN_REASON"
            echo "- Scanned range: \`$SCAN_RANGE\`"
            echo "- Head SHA: \`$SCAN_HEAD_SHA\`"
            echo "- Non-merge commits in range: $SCAN_COMMIT_COUNT"
            echo "- Commits Gitleaks reported scanning: $SCAN_REPORTED_COUNT"
            echo "- Scanner exit code: $SCAN_SCANNER_EXIT"
            echo '- Redacted SARIF and scan metadata are attached as the `secret-scan-results` artifact when available.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks-${{ github.run_id }}
          if-no-files-found: warn

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Publish job summary
        if: always()
        shell: bash
        run: echo '## Pull request dependency review' >> "$GITHUB_STEP_SUMMARY"
