name: WareCommand quality

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-test-and-migration-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and packages
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet restore "Warehouse Management System.sln" --nologo

      - name: Build
        shell: pwsh
        run: dotnet build "Warehouse Management System.sln" -c Release --no-restore --nologo -v:minimal

      - name: Test
        shell: pwsh
        run: dotnet test "Warehouse Management System.sln" -c Release --no-build --no-restore --nologo --logger "console;verbosity=minimal"

      - name: Format
        shell: pwsh
        run: dotnet format "Warehouse Management System.sln" --verify-no-changes --no-restore --severity error

      - name: Verify migration model and startup gate
        shell: pwsh
        run: pwsh -NoProfile -File ".\scripts\verify-migrations.ps1"
