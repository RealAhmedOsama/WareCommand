services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${WARECOMMAND_POSTGRES_DB:-warecommand}
      POSTGRES_USER: ${WARECOMMAND_POSTGRES_USER:-warecommand}
      POSTGRES_PASSWORD: ${WARECOMMAND_POSTGRES_PASSWORD:?Set WARECOMMAND_POSTGRES_PASSWORD for local PostgreSQL}
    ports:
      - "${WARECOMMAND_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
